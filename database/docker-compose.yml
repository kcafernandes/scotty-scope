services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Missing POSTGRES_USER. Copy database/.env.example to database/.env and fill it in.}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Missing POSTGRES_PASSWORD. Copy database/.env.example to database/.env and fill it in.}
      POSTGRES_DB: ${POSTGRES_DB:?Missing POSTGRES_DB. Copy database/.env.example to database/.env and fill it in.}
    ports:
    - "127.0.0.1:5432:5432"
    volumes:
    - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
